<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Dictation AI Settings</title>
    <link rel="stylesheet" href="/src/styles.css" />
    <script type="module" src="/src/main.ts" defer></script>
  </head>
  <body>
    <main>
      <section class="row">
        <div class="label">
          <label for="api-key">OpenRouter key</label>
          <p class="hint">Needed for clean-up and cloud transcription. Stored in your macOS Keychain.</p>
        </div>
        <div class="control">
          <div id="key-entry" class="key-entry">
            <input id="api-key" type="password" spellcheck="false" autocomplete="off"
                   placeholder="sk-or-v1-…" aria-label="OpenRouter API key" />
            <button id="key-save" type="button" class="button">Save</button>
          </div>
          <p id="key-saved" class="key-saved" hidden>Saved <span id="key-hint"></span></p>
          <div id="key-actions" class="key-actions" hidden>
            <button id="key-check" type="button" class="link">Check key</button>
            <button id="key-replace" type="button" class="link">Replace</button>
            <button id="key-remove" type="button" class="link">Remove</button>
          </div>
          <p id="key-message" class="message" aria-live="polite"></p>
        </div>
      </section>

      <section class="row">
        <div class="label">
          <label for="hotkey">Hotkey</label>
          <p class="hint">Hold to talk, release to paste.</p>
        </div>
        <div class="control">
          <button id="hotkey" type="button" class="keycap"></button>
          <p id="hotkey-message" class="message" aria-live="polite"></p>
          <button id="hotkey-reset" type="button" class="link">Reset to default</button>
        </div>
      </section>

      <section class="row">
        <div class="label">
          <label for="microphone">Microphone</label>
          <p class="hint">Which input to record from.</p>
        </div>
        <div class="control">
          <select id="microphone"></select>
          <button id="microphone-reset" type="button" class="link">Reset to default</button>
        </div>
      </section>

      <section class="row">
        <div class="label">
          <span id="engine-label" class="label-text">Transcription</span>
          <p class="hint">Where speech becomes text.</p>
        </div>
        <div class="control">
          <div class="segmented" role="radiogroup" aria-labelledby="engine-label">
            <button id="engine-cloud" type="button" role="radio" aria-checked="true">Cloud</button>
            <button id="engine-local" type="button" role="radio" aria-checked="false">On this Mac</button>
          </div>
          <select id="cloud-model" aria-label="Cloud transcription model"></select>
          <input id="cloud-model-other" type="text" spellcheck="false" autocomplete="off"
                 placeholder="vendor/model-id" aria-label="Cloud transcription model ID" hidden />
          <select id="local-model" aria-label="Local model" hidden></select>
          <p id="engine-hint" class="message"></p>
          <button id="transcription-reset" type="button" class="link">Reset to default</button>
        </div>
      </section>

      <section class="row">
        <div class="label">
          <label for="cleanup-model">Clean-up</label>
          <p id="cleanup-hint" class="hint"></p>
        </div>
        <div class="control">
          <div class="segmented" role="radiogroup" aria-label="Clean-up">
            <button id="cleanup-on" type="button" role="radio" aria-checked="true">On</button>
            <button id="cleanup-off" type="button" role="radio" aria-checked="false">Off</button>
          </div>
          <select id="cleanup-model"></select>
          <input id="model" type="text" spellcheck="false" autocomplete="off"
                 placeholder="vendor/model-id" aria-label="Clean-up model ID" hidden />
          <button id="model-reset" type="button" class="link">Reset to default</button>
        </div>
      </section>

      <p id="saved" class="saved" aria-live="polite"></p>

    </main>
  </body>
</html>
